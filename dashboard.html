<!-- Razorpay Checkout -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
const RAZORPAY_KEY_ID = rzp_test_TXW0Vxl6C3gHrq
const BACKEND_URL = "https://shree-multi-services-backend.onrender.com";


/* =========================
   ADD MONEY
========================= */

async function openAddMoney(amount) {

    if (!amount || amount < 10) {
        alert("किमान ₹10 रक्कम निवडा.");
        return;
    }

    try {

        // Backend वर Order तयार करणे
        const response = await fetch(
            BACKEND_URL + "/create-order",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    amount: amount
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert(data.message || "Order तयार झाला नाही.");
            return;
        }


        /* =========================
           RAZORPAY OPTIONS
        ========================= */

        const options = {

            key: RAZORPAY_KEY_ID,

            amount: data.order.amount,

            currency: "INR",

            name: "Shree Multi Services",

            description: "Wallet Recharge",

            order_id: data.order.id,


            handler: async function (payment) {

                try {

                    // Payment Verify
                    const verifyResponse = await fetch(
                        BACKEND_URL + "/verify-payment",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                razorpay_order_id:
                                    payment.razorpay_order_id,

                                razorpay_payment_id:
                                    payment.razorpay_payment_id,

                                razorpay_signature:
                                    payment.razorpay_signature
                            })
                        }
                    );


                    const verifyData =
                        await verifyResponse.json();


                    if (verifyData.success) {

                        /* =========================
                           WALLET UPDATE
                        ========================= */

                        let wallet =
                            Number(
                                localStorage.getItem(
                                    "walletBalance"
                                ) || 50
                            );

                        wallet += Number(amount);

                        localStorage.setItem(
                            "walletBalance",
                            wallet
                        );


                        updateWallet();


                        alert(
                            "✅ Payment Successful!\n\n" +
                            "₹" + amount +
                            " Wallet मध्ये जमा झाले."
                        );

                    } else {

                        alert(
                            "❌ Payment verification failed."
                        );

                    }

                } catch (error) {

                    console.error(error);

                    alert(
                        "Payment verify करताना error आला."
                    );

                }

            },


            theme: {
                color: "#0d6efd"
            }

        };


        /* =========================
           OPEN RAZORPAY
        ========================= */

        const rzp =
            new Razorpay(options);


        rzp.on(
            "payment.failed",
            function (response) {

                console.error(response.error);

                alert(
                    "❌ Payment Failed\n\n" +
                    response.error.description
                );

            }
        );


        rzp.open();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server connection error.\n\n" +
            "कृपया थोड्या वेळाने पुन्हा प्रयत्न करा."
        );

    }
}


/* =========================
   WALLET DISPLAY
========================= */

function updateWallet() {

    let wallet =
        Number(
            localStorage.getItem(
                "walletBalance"
            ) || 50
        );


    const walletElement =
        document.getElementById(
            "walletBalance"
        );


    if (walletElement) {

        walletElement.innerText =
            "₹" + wallet.toFixed(2);

    }

}


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (
            !localStorage.getItem(
                "walletBalance"
            )
        ) {

            localStorage.setItem(
                "walletBalance",
                "50"
            );

        }

        updateWallet();

    }
);
</script>
