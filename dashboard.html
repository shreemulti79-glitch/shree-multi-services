/* =========================
   SAVE
========================= */

function saveForm(type){

 const form=document.getElementById("serviceForm");

 /* Basic file-size checks */
 const files=form.querySelectorAll("input[type=file]");

 for(const f of files){

  if(!f.files.length) continue;

  const file=f.files[0];
  const name=file.name.toLowerCase();

  if(type==="gaz"){
   if(f.id==="photo" &&
      (!name.endsWith(".jpg")&&!name.endsWith(".jpeg")
       ||file.size>20*1024)){
    alert("Gazetted photo must be JPEG and under 20KB.");
    return;
   }

   if(f.id!=="photo" && file.size>500*1024){
    alert("Gazetted PDF must be under 500KB.");
    return;
   }
  }

  if(type==="shop"){
   if((f.id==="photo"||f.id==="signature") &&
      file.size>20*1024){
    alert("Photo/Signature must be under 20KB.");
    return;
   }
  }

  if(type==="udyog" && file.size>500*1024){
   alert("Aadhaar/PAN file must be under 500KB.");
   return;
  }

  if(type==="food" && f.id==="photo" &&
     file.size>20*1024){
   alert("Passport photo must be under 20KB.");
   return;
  }
 }

 const data={};

 form.querySelectorAll("input,select,textarea").forEach(x=>{
  if(x.type==="file"){
   data[x.id]=x.files[0]?x.files[0].name:"";
  }else if(x.type==="checkbox"){
   data[x.id]=x.checked;
  }else{
   data[x.id]=x.value;
  }
 });

 data.id=type.toUpperCase()+Date.now();
 data.service=type;
 data.status="Pending";
 data.createdAt=new Date().toISOString();

 let arr=JSON.parse(
  localStorage.getItem("serviceApplications")||"[]"
 );

 arr.push(data);

 localStorage.setItem(
  "serviceApplications",
  JSON.stringify(arr)
 );

 alert(
  "Application Submitted Successfully!\n\n"+
  "Application No: "+data.id
 );

 updateStats();
 showList(type,"All");
}


/* =========================
   LIST
========================= */

function showList(type,status){

 closeSide();

 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("formBox").classList.add("hidden");

 const box=document.getElementById("listBox");
 box.classList.remove("hidden");

 document.getElementById("title").textContent=
 type==="pan"?"PAN Applications":
 type==="shop"?"Shop Act Applications":
 type==="gaz"?"Gazetted Applications":
 type==="food"?"Food License Applications":
 "Udyog Aadhaar Applications";

 const all=JSON.parse(
  localStorage.getItem("serviceApplications")||"[]"
 );

 let data=all.filter(x=>x.service===type);

 if(status!=="All"){
  data=data.filter(x=>x.status===status);
 }

 let html=`<h2>${document.getElementById("title").textContent}</h2>`;

 if(!data.length){
  html+=`<p>No applications found.</p>`;
 }else{

  html+=`
  <table>
  <tr>
   <th>Application No</th>
   <th>Name</th>
   <th>Status</th>
   <th>Date</th>
   <th>Action</th>
  </tr>`;

  data.reverse().forEach(x=>{

   html+=`
   <tr>
    <td>${safe(x.id)}</td>
    <td>${safe(
      x.fullName||x.aadhaarName||x.panName||
      x.shopName||x.owner||"-"
    )}</td>
    <td><span class="badge">${safe(x.status)}</span></td>
    <td>${new Date(x.createdAt).toLocaleDateString("en-IN")}</td>
    <td>
     <button class="btn" onclick="viewApp('${x.id}')">View</button>
     <button class="btn gray" onclick="printApp('${x.id}')">Print</button>
    </td>
   </tr>`;
  });

  html+=`</table>`;
 }

 box.innerHTML=html;
}

function viewApp(id){

 const arr=JSON.parse(
  localStorage.getItem("serviceApplications")||"[]"
 );

 const x=arr.find(a=>a.id===id);

 if(!x)return;

 let html=`<h2>Application Details</h2>
 <table>`;

 Object.keys(x).forEach(k=>{

  if(k==="id"||k==="service")return;

  html+=`
  <tr>
   <th>${safe(k)}</th>
   <td>${safe(String(x[k]))}</td>
  </tr>`;
 });

 html+=`</table>
 <button class="btn" onclick="printApp('${x.id}')">Print</button>
 <button class="btn gray" onclick="home()">Back</button>`;

 document.getElementById("formBox").classList.add("hidden");
 document.getElementById("listBox").classList.remove("hidden");
 document.getElementById("listBox").innerHTML=html;
}

 let rows="";

  rows+=`

 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
