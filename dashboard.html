<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Shree Multi Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 27px;
            color: #222;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
        }

        #loginBtn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginBtn:hover {
            background: #5568d9;
        }

        #loginBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 22px;
            font-size: 14px;
            font-weight: bold;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 20px;
            }

            .logo h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <h1>Shree Multi Services</h1>
            <p>Login to your account</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Login ID</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Login ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

            <div id="message"></div>

        </form>

        <div class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>


    <script>

        /*
        ==========================================
        LOGIN PAGE PROTECTION
        ==========================================
        जर user आधीच login असेल तर
        पुन्हा Login Page दाखवायची नाही.
        */

        (function () {

            if (sessionStorage.getItem("isLoggedIn") === "true") {

                window.location.replace("dashboard.html");

            }

        })();


        /*
        ==========================================
        LOGIN FORM
        ==========================================
        */

        document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {

            e.preventDefault();


            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const loginBtn =
                document.getElementById("loginBtn");


            /*
            ==========================================
            REGISTER केलेला USER शोधणे
            ==========================================
            */

            const registeredUsername =
                localStorage.getItem("registeredUsername");

            const registeredPassword =
                localStorage.getItem("registeredPassword");


            /*
            ==========================================
            ACCOUNT CHECK
            ==========================================
            */

            if (!registeredUsername || !registeredPassword) {

                message.style.color = "red";

                message.textContent =
                    "Account not found. Please Register first.";

                return;
            }


            /*
            ==========================================
            USERNAME + PASSWORD CHECK
            ==========================================
            */

            if (
                username === registeredUsername &&
                password === registeredPassword
            ) {

                /*
                LOGIN SUCCESS
                */

                sessionStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

                sessionStorage.setItem(
                    "loginUser",
                    username
                );


                /*
                जुना dashboard code सुद्धा
                username वापरत असल्यामुळे ठेवत आहोत.
                */

                localStorage.setItem(
                    "username",
                    username
                );

                localStorage.setItem(
                    "loginStatus",
                    "true"
                );


                message.style.color = "green";

                message.textContent =
                    "Login Successful!";


                loginBtn.disabled = true;

                loginBtn.textContent =
                    "Opening Dashboard...";


                /*
                ==========================================
                DASHBOARD OPEN
                ==========================================
                */

                setTimeout(function () {

                    window.location.replace(
                        "dashboard.html"
                    );

                }, 500);


            } else {

                /*
                LOGIN FAILED
                */

                message.style.color = "red";

                message.textContent =
                    "Invalid Username or Password.";


                document.getElementById(
                    "password"
                ).value = "";


                document.getElementById(
                    "password"
                ).focus();

            }

        });

    </script>

</body>
</html>
